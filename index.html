<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Watch Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js para os gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
  </style>
</head>
<body class="p-4 sm:p-8 min-h-screen">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Cabeçalho -->
    <header class="flex justify-between items-center border-b border-gray-800 pb-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-orange-400 via-pink-500 to-indigo-400 bg-clip-text text-transparent">
          Apple Watch Health Hub
        </h1>
        <p class="text-xs sm:text-sm text-gray-400">Sincronizado automaticamente com Apple Watch SE2</p>
      </div>
      <div id="last-sync" class="text-xs text-gray-500 text-right">Carregando...</div>
    </header>

    <!-- Cards Principais (Hoje) -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <!-- Card Passos -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-lg">
        <div class="flex items-center justify-between text-gray-400 mb-2">
          <span class="text-sm font-medium">Passos Hoje</span>
          <span class="text-xl">👟</span>
        </div>
        <div id="today-steps" class="text-3xl font-bold text-emerald-400">--</div>
        <p class="text-xs text-gray-500 mt-2">Meta: 10.000 passos</p>
      </div>

      <!-- Card Calorias -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-lg">
        <div class="flex items-center justify-between text-gray-400 mb-2">
          <span class="text-sm font-medium">Calorias Ativas</span>
          <span class="text-xl">🔥</span>
        </div>
        <div id="today-calories" class="text-3xl font-bold text-orange-400">-- <span class="text-sm font-normal text-gray-400">kcal</span></div>
        <p class="text-xs text-gray-500 mt-2">Movimento no dia</p>
      </div>

      <!-- Card Sono -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-lg">
        <div class="flex items-center justify-between text-gray-400 mb-2">
          <span class="text-sm font-medium">Horas de Sono</span>
          <span class="text-xl">🌙</span>
        </div>
        <div id="today-sleep" class="text-3xl font-bold text-indigo-400">-- <span class="text-sm font-normal text-gray-400">h</span></div>
        <p class="text-xs text-gray-500 mt-2">Noite anterior</p>
      </div>
    </div>

    <!-- Gráfico Histórico -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-lg">
      <h2 class="text-lg font-semibold text-gray-200 mb-4">Histórico Recente</h2>
      <div class="relative h-72 w-full">
        <canvas id="healthChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    // CONFIGURAÇÃO DO SEU SUPABASE
    const SUPABASE_URL = "https://dhozzuhlwojwajvilaob.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WvxraxjdPwV6riBSamerpw_xJFTsrCo"; // <-- COLE SUA PUBLISHABLE KEY AQUI

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadHealthData() {
      // Busca os últimos 14 registros ordenados por data
      const { data, error } = await supabase
        .from('health_metrics')
        .select('*')
        .order('date', { ascending: true })
        .limit(14);

      if (error) {
        console.error("Erro ao carregar dados:", error);
        return;
      }

      if (!data || data.length === 0) return;

      // Pega o registro mais recente
      const latest = data[data.length - 1];

      document.getElementById('today-steps').innerText = Number(latest.steps || 0).toLocaleString('pt-BR');
      document.getElementById('today-calories').innerHTML = `${Number(latest.calories || 0).toFixed(0)} <span class="text-sm font-normal text-gray-400">kcal</span>`;
      document.getElementById('today-sleep').innerHTML = `${Number(latest.sleep_hours || 0).toFixed(1)} <span class="text-sm font-normal text-gray-400">h</span>`;

      if (latest.updated_at) {
        const d = new Date(latest.updated_at);
        document.getElementById('last-sync').innerText = `Última sincronização:\n${d.toLocaleDateString('pt-BR')} às ${d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}`;
      }

      // Prepara os dados para o gráfico
      const labels = data.map(item => {
        const parts = item.date.split('-');
        return `${parts[2]}/${parts[1]}`;
      });
      const stepsData = data.map(item => Number(item.steps || 0));
      const caloriesData = data.map(item => Number(item.calories || 0));

      renderChart(labels, stepsData, caloriesData);
    }

    function renderChart(labels, steps, calories) {
      const ctx = document.getElementById('healthChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Passos',
              data: steps,
              backgroundColor: 'rgba(52, 211, 153, 0.7)',
              borderRadius: 6,
              yAxisID: 'y'
            },
            {
              label: 'Calorias (kcal)',
              data: calories,
              type: 'line',
              borderColor: 'rgba(251, 146, 60, 1)',
              backgroundColor: 'rgba(251, 146, 60, 0.2)',
              borderWidth: 2,
              tension: 0.3,
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#9ca3af' } }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#9ca3af' }
            },
            y: {
              type: 'linear',
              position: 'left',
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#34d399' }
            },
            y1: {
              type: 'linear',
              position: 'right',
              grid: { drawOnChartArea: false },
              ticks: { color: '#fb923c' }
            }
          }
        }
      });
    }

    loadHealthData();
  </script>
</body>
</html>
